<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basketball Championship</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch & Mobile Icons (for iOS home screen shortcuts) -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Basketball Stats">

  <!-- Standard Favicon -->
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "a15432df-7474-45b4-bad6-c279a35d9a72", // Replace with your OneSignal App ID
        safari_web_id: "", // Optional Safari web ID if applicable
        notifyButton: {
          enable: true,
        },
      });

      // Example: Automatically prompt for push notifications and assign tags
      try {
        await OneSignal.Slidedown.promptPush();
        
        // You can tag users dynamically (e.g., player name, role)
        // This tag can be updated when a player logs in or is identified
        await OneSignal.User.addTag("role", "player");
      } catch (error) {
        console.error("OneSignal Initialization Error:", error);
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
